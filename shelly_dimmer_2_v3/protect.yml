# Shelly Dimmer 2 - v3 protection: NTC temperature + shutdown script.
# No VCC adc here: on ESP8266 reading VCC breaks the A0 thermistor reading.
substitutions:
  max_temp: "70"                  # °C

script:
  - id: protect_device
    mode: single
    parameters:
      reason: string
    then:
      - light.turn_off: ${deviceid}_light
      - logger.log:
          level: WARN
          format: "Light turned off: %s limit exceeded"
          args: [reason.c_str()]
      # Notify HA last, so protection never depends on HA being reachable.
      # Needs "Allow the device to perform Home Assistant actions" in HA.
      - homeassistant.action:
          action: persistent_notification.create
          data:
            title: "${devicename}"
            message: !lambda 'return "Light turned off: " + reason + " limit exceeded.";'

sensor:
  - platform: ntc
    sensor: ${deviceid}_temp_resistance
    name: ${devicename} Temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    on_value_range:
      - above: ${max_temp}
        then:
          - script.execute: {id: protect_device, reason: "temperature"}

  - platform: resistance
    id: ${deviceid}_temp_resistance
    sensor: ${deviceid}_temp_adc
    configuration: DOWNSTREAM
    resistor: 32kOhm

  - platform: adc
    id: ${deviceid}_temp_adc
    pin: A0
