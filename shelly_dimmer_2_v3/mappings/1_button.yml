# One momentary button on SW1 and/or SW2.
# press: on (if off) | tap: off | double tap: 100% | hold: dim
# Hold dims down to 1% and stops; hold again from that 1% (or from off) to dim up.
# Timing is in dimming.yml (btn_down / btn_up), not on_multi_click.
binary_sensor:
  - platform: template
    name: "$devicename Button"
    id: ${deviceid}_button
    lambda: return id(${deviceid}_input_1).state || id(${deviceid}_input_2).state;
    on_press:
      - script.execute:
          id: btn_down
          slot: 0
          double_pct: 100
          hold_dir: 0
    on_release:
      - script.execute: btn_up
